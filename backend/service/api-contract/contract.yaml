openapi: 3.0.3
info:
  title: Q-Star Issue Manager API
  description: >
    Thin authenticated gateway in front of the "Q-Star Issues" and
    "Q-Star Progress Log" SharePoint lists. SharePoint remains the system
    of record; this service validates the caller's Azure AD bearer token,
    applies Q-Star's business rules, and proxies to SharePoint via
    Microsoft Graph using its own application identity (Sites.Selected).
  version: 1.0.0
servers:
  - url: /api/v1

paths:
  /issues:
    get:
      operationId: getIssues
      summary: Return the full issue register (all triaged and untriaged issues).
      tags: [Issues]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: createIssue
      summary: Create a new issue (intake).
      tags: [Issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/Error"

  /issues/{id}:
    patch:
      operationId: updateIssue
      summary: Partially update an issue (triage, status change, on-hold, close, etc).
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssuePatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /issues/{id}/progress:
    post:
      operationId: addProgressLogEntry
      summary: Append an entry to an issue's progress log (append-only).
      tags: [Issues]
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressLogEntry"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressLogEntry"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /settings:
    get:
      operationId: getSettings
      summary: Read the IT-settings tab's configuration.
      tags: [Settings]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "500":
          $ref: "#/components/responses/Error"
    put:
      operationId: saveSettings
      summary: Replace the IT-settings tab's configuration.
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "500":
          $ref: "#/components/responses/Error"

  /diagnostics:
    get:
      operationId: getDiagnostics
      summary: >
        Server-side connection self-test: confirms this service's own
        Graph app-identity can reach the SharePoint site and both lists.
        The frontend-side equivalent (ConnectionDiagnosticsService.ts)
        checks the browser-to-backend leg; this checks the backend-to-
        SharePoint leg.
      tags: [Diagnostics]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiagnosticCheck"

components:
  parameters:
    IssueId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # NOTE: validation errors are NOT a distinct response shape at runtime — see
    # CustomExceptionHandler.java / ValidationError.java: every error, including
    # constraint-violation ones, is built as GenericError and serialized via
    # toErrorResponse() into the same Error/ErrorATO shape, with the field-level
    # violations placed in Error's free-form `meta` object (as
    # {"validationErrors": [...]}). This alias exists only so 400 responses in
    # this contract can carry an intention-revealing name; it points at the same
    # schema as Error rather than a separate ValidationErrorATO, to match.
    ValidationError:
      description: Validation error (an Error whose meta.validationErrors holds the field-level violations)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # NOTE: Severity/IssueStatus/TransformedInto/AlreadyInContact-style fields
    # are deliberately plain `type: string` rather than JSON Schema `enum:`.
    # openapi-generator's spring codegen turns an `enum:` constraint into a
    # dedicated generated Java enum class (e.g. IssueStatusATO), which would
    # no longer field-match the plain String properties on model.Issue that
    # ReMap's SimpleATOMapper relies on for automatic mapping — trading a
    # small amount of API-layer strictness for a mapper that works without
    # per-field custom transforms. Valid values are documented here instead,
    # and are still enforced by the underlying SharePoint Choice columns.

    ProgressLogEntry:
      type: object
      required: [ts, author, text]
      properties:
        ts:
          type: string
        author:
          type: string
        text:
          type: string

    # Field names deliberately mirror frontend/src/webparts/qstarIssueManager/models/IIssue.ts
    # one-for-one so the SPFx data service needs no remapping.
    Issue:
      type: object
      required:
        [
          id,
          qsNumber,
          triaged,
          taskCreated,
          shortSummary,
          description,
          severity,
        ]
      properties:
        id:
          type: integer
          format: int64
        qsNumber:
          type: integer
        triaged:
          type: boolean
        status:
          type: string
          description: "Created | In Progress | Under Testing/Revision | On Hold | Closed | Rejected"
        taskCreated:
          type: string
          description: "Yes | No"
        transformedInto:
          type: string
          description: "OFI | NC Minor | NC Major | Only sent to Dept/BU for Action"
        shortSummary:
          type: string
        description:
          type: string
        immediateAction:
          type: string
        severity:
          type: string
          description: "Critical | High | Medium | Low"
        createdBy:
          type: string
        reportDate:
          type: string
        departmentBU:
          type: string
        region:
          type: string
        alreadyInContact:
          type: string
          description: "Yes | No"
        deviationType:
          type: string
        issueOrigin:
          type: string
        additionalComments:
          type: string
        followUp:
          type: string
        taskOwner:
          type: string
        ownerBU:
          type: string
        dueDate:
          type: string
        rootCause:
          type: string
        correctiveAction:
          type: string
        implementationDate:
          type: string
        effectivenessCheck:
          type: string
        verifiedBy:
          type: string
        verifiedDate:
          type: string
        closedDate:
          type: string
        closedAt:
          type: string
        holdReason:
          type: string
        holdUntil:
          type: string
        ownerUpdate:
          type: boolean
        ownerUpdateAt:
          type: string
        ownerUpdateText:
          type: string
        progressLog:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/ProgressLogEntry"

    IssueCreate:
      description: Fields supplied at intake; the rest default server-side.
      type: object
      required: [shortSummary, description, severity]
      properties:
        shortSummary:
          type: string
        description:
          type: string
        immediateAction:
          type: string
        severity:
          type: string
          description: "Critical | High | Medium | Low"
        createdBy:
          type: string
        reportDate:
          type: string
        departmentBU:
          type: string
        region:
          type: string
        alreadyInContact:
          type: string
          description: "Yes | No"
        deviationType:
          type: string
        issueOrigin:
          type: string
        additionalComments:
          type: string

    IssuePatch:
      description: Any subset of Issue's mutable fields.
      type: object
      properties:
        triaged:
          type: boolean
        status:
          type: string
          description: "Created | In Progress | Under Testing/Revision | On Hold | Closed | Rejected"
        taskCreated:
          type: string
          description: "Yes | No"
        transformedInto:
          type: string
          description: "OFI | NC Minor | NC Major | Only sent to Dept/BU for Action"
        followUp:
          type: string
        taskOwner:
          type: string
        ownerBU:
          type: string
        dueDate:
          type: string
        rootCause:
          type: string
        correctiveAction:
          type: string
        implementationDate:
          type: string
        effectivenessCheck:
          type: string
        verifiedBy:
          type: string
        verifiedDate:
          type: string
        closedDate:
          type: string
        closedAt:
          type: string
        holdReason:
          type: string
        holdUntil:
          type: string
        ownerUpdate:
          type: boolean
        ownerUpdateAt:
          type: string
        ownerUpdateText:
          type: string

    Settings:
      type: object
      properties:
        msFormUrl:
          type: string
        flowId:
          type: string
        spSiteUrl:
          type: string
        spListName:
          type: string
        tenantId:
          type: string
        clientId:
          type: string
        connected:
          type: boolean
        lastTested:
          type: string
        access:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/AccessEntry"

    AccessEntry:
      type: object
      properties:
        email:
          type: string
        role:
          type: string
          description: "admin | qm | owner | reader"

    DiagnosticCheck:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          description: "pass | warn | fail"
        message:
          type: string

    Error:
      type: object
      properties:
        id:
          type: string
        status:
          type: integer
        code:
          type: string
        title:
          type: string
        details:
          type: string
        meta:
          description: >
            Free-form bag for extra context. ValidationError.toErrorResponse()
            puts field-level violations here as
            {"validationErrors": [{field, message, rejectedValue}, ...]}.
          type: object
          additionalProperties: true
