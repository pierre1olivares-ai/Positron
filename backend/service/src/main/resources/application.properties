springfox.documentation.swagger.v2.path=/api-docs
server.servlet.context-path=/
server.servlet.contextPath=/
server.port=8080


#no spring banner
spring.main.banner-mode=off

#Debug Messages
spring.output.ansi.enabled=ALWAYS

#JDBI SQL Log Output
app.enablesqllogging=false

debug=false
trace=false

tm.stage=${TM_STAGE}
tm.qstar.bugsnag.api.key=${TM_QSTAR_BUGSNAG_KEY}

spring.jackson.serialization.WRITE_DATES_WITH_ZONE_ID=true
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=true
spring.jackson.deserialization.ADJUST_DATES_TO_CONTEXT_TIME_ZONE=false
spring.jackson.parser.ALLOW_UNQUOTED_CONTROL_CHARS=true
spring.jackson.deserialization.ACCEPT_SINGLE_VALUE_AS_ARRAY=true

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.resources.add-mappings=false

spring.datasource.url=${TM_QSTAR_DATASOURCE_URL}
spring.datasource.username=${TM_QSTAR_DATASOURCE_USERNAME}
spring.datasource.password=${TM_QSTAR_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimumIdle=1

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${TM_QSTAR_DATASOURCE_URL}
spring.flyway.user=${TM_QSTAR_DATASOURCE_USERNAME}
spring.flyway.password=${TM_QSTAR_DATASOURCE_PASSWORD}
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate = true

spring.jpa.generate-ddl=true

spring.security.oauth2.client.registration.azure.client-id=${TM_QSTAR_AD_CLIENT_ID}
spring.security.oauth2.client.registration.azure.client-secret=${TM_QSTAR_AD_CLIENT_SECRET}

azure.activedirectory.tenant-id=${TM_QSTAR_AD_TENANT_ID}
azure.activedirectory.client-id=${TM_QSTAR_AD_CLIENT_ID}
azure.activedirectory.client-secret=${TM_QSTAR_AD_CLIENT_SECRET}
# TODO: "ci-sign-time-matters" was a hardcoded, project-specific value left over from
# whatever project this template was extracted from — replace with the real Entra
# security group(s) IT creates for Q-Star access once they exist.
azure.activedirectory.user-group.allowed-groups=ci-sign-time-matters
azure.mediaservices.allow-telemetry=false

# --- Q-Star: SharePoint via Microsoft Graph (app-only, Sites.Selected) -------------
# This service is a thin gateway: SharePoint is still the real data store (see
# backend/sharepoint/qstar-sharepoint-graph-integration.md). These credentials are
# for the backend's OWN app identity to call Graph, separate from the
# TM_QSTAR_AD_* values above (which authenticate callers of THIS API, i.e. the SPFx
# web part) — they may end up being the same Entra app registration granted both an
# exposed API scope and Sites.Selected application permissions, or two separate
# registrations; either way needs an admin to grant Sites.Selected write access to
# the Quality site (see the integration doc, section 4.5) before this can work.
qstar.sharepoint.tenant-id=${TM_QSTAR_AD_TENANT_ID}
qstar.sharepoint.client-id=${TM_QSTAR_SP_CLIENT_ID}
qstar.sharepoint.client-secret=${TM_QSTAR_SP_CLIENT_SECRET}
qstar.sharepoint.site-hostname=${TM_QSTAR_SP_SITE_HOSTNAME}
qstar.sharepoint.site-path=${TM_QSTAR_SP_SITE_PATH}
qstar.sharepoint.issues-list=Q-Star Issues
qstar.sharepoint.progress-list=Q-Star Progress Log