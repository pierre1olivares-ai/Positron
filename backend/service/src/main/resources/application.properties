server.servlet.context-path=/
server.port=8080
spring.main.banner-mode=off
debug=false
trace=false
tm.stage=${TM_STAGE:local}
app.enablesqllogging=false

# The IT template database is unwired; Q-Star stores business data in SharePoint.
spring.flyway.enabled=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.deserialization.ADJUST_DATES_TO_CONTEXT_TIME_ZONE=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Do not record HTTP bodies containing issue details, credentials or journal text.
logbook.filter.enabled=false
qstar.telemetry.bugsnag.enabled=${TM_QSTAR_BUGSNAG_ENABLED:false}
tm.qstar.bugsnag.api.key=${TM_QSTAR_BUGSNAG_KEY:}

# Keep off pending narrow delegated REST consent and tenant acceptance.
# Pinning an endpoint does not replace restricted tenant consent.
qstar.backend.enabled=${TM_QSTAR_BACKEND_ENABLED:false}
qstar.security.tenant-id=${TM_QSTAR_AD_TENANT_ID:}
qstar.security.client-id=${TM_QSTAR_AD_CLIENT_ID:}
qstar.security.app-id-uri=${TM_QSTAR_AD_APP_ID_URI:}
qstar.security.required-scope=${TM_QSTAR_API_SCOPE:user_impersonation}
qstar.security.allowed-origins=${TM_QSTAR_ALLOWED_ORIGINS:}
qstar.security.admin-role=${TM_QSTAR_ADMIN_ROLE:QStar.Admin}
qstar.security.qm-role=${TM_QSTAR_QM_ROLE:QStar.QM}
qstar.security.owner-role=${TM_QSTAR_OWNER_ROLE:QStar.Owner}
qstar.security.reader-role=${TM_QSTAR_READER_ROLE:QStar.Reader}

# Correct Azure Spring 5.17.1 properties. This API's confidential client and the
# verified caller assertion are used together. There is no application grant.
spring.cloud.azure.active-directory.enabled=${qstar.backend.enabled}
spring.cloud.azure.active-directory.application-type=resource_server_with_obo
spring.cloud.azure.active-directory.profile.tenant-id=${qstar.security.tenant-id}
spring.cloud.azure.active-directory.credential.client-id=${qstar.security.client-id}
spring.cloud.azure.active-directory.credential.client-secret=${TM_QSTAR_AD_CLIENT_SECRET:}
spring.cloud.azure.active-directory.credential.client-certificate-path=${TM_QSTAR_AD_CERTIFICATE_PATH:}
spring.cloud.azure.active-directory.credential.client-certificate-password=${TM_QSTAR_AD_CERTIFICATE_PASSWORD:}
spring.cloud.azure.active-directory.app-id-uri=${qstar.security.app-id-uri}
# The sole client registration is built from the validated SharePoint hostname:
# scope https://<hostname>/.default, grant JWT bearer OBO.

qstar.sharepoint.site-url=${TM_QSTAR_SP_SITE_URL:}
# Legacy hostname/path input is accepted when site-url is empty.
qstar.sharepoint.site-hostname=${TM_QSTAR_SP_SITE_HOSTNAME:}
qstar.sharepoint.site-path=${TM_QSTAR_SP_SITE_PATH:}
qstar.sharepoint.issues-list-name=${TM_QSTAR_ISSUES_LIST:Q-Star Issues}
qstar.sharepoint.progress-list-name=${TM_QSTAR_PROGRESS_LIST:Q-Star Progress Log}
qstar.sharepoint.config-list-name=${TM_QSTAR_CONFIG_LIST:Q-Star Config}
qstar.sharepoint.beta-access-mode=${TM_QSTAR_BETA_ACCESS_MODE:false}
