pool:
  vmImage: 'ubuntu-latest'

# Local validation does not run this pipeline or publish an image. IT configures
# the registry service connection and the host variable before using it.
variables:
  projectName: 'qstar-issue-manager-backend'

steps:
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  - task: Gradle@4
    inputs:
      gradleWrapperFile: 'backend/service/gradlew'
      workingDirectory: 'backend/service'
      tasks: 'build'
      publishJUnitResults: true
      testResultsFiles: 'backend/service/build/test-results/test/TEST-*.xml'
      javaHomeOption: 'Path'
      jdkDirectory: '$(JAVA_HOME)'
      sonarQubeRunAnalysis: false

  - bash: |
      set -euo pipefail
      dateNow="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      echo "##vso[task.setvariable variable=dateNow]$dateNow"
      echo "##vso[task.setvariable variable=imageTag]$BUILD_SOURCEVERSION"
    displayName: 'Set image metadata'

  - task: Docker@2
    displayName: 'Build and push backend image'
    inputs:
      command: buildAndPush
      containerRegistry: Docker Registry
      Dockerfile: '$(Build.SourcesDirectory)/backend/service/Dockerfile'
      buildContext: '$(Build.SourcesDirectory)/backend/service'
      repository: qstar-issue-manager-backend
      tags: |
        $(imageTag)

  - bash: |
      set -euo pipefail
      test -n "$host"
      if [[ "$host" == *'$('* || "$host" == *'/'* ]]; then
        echo 'Set the pipeline host variable to the intended DNS hostname.' >&2
        exit 1
      fi
      envsubst '$dateNow $gitSHA1 $imageTag $host' < kubernetes.yaml > kubernetes_out.yaml
    workingDirectory: '$(Build.SourcesDirectory)/backend/service'
    env:
      dateNow: $(dateNow)
      gitSHA1: $(Build.SourceVersion)
      imageTag: $(imageTag)
      host: $(host)
    displayName: 'Prepare deployment manifest (does not apply it)'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish deployment manifest'
    inputs:
      artifactName: 'kubernetesYAML'
      targetPath: '$(Build.SourcesDirectory)/backend/service/kubernetes_out.yaml'
